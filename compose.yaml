services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: dexian
      POSTGRES_USER: dexian
      POSTGRES_PASSWORD: dexian_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dexian -d dexian"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dexian_postgres_data:/var/lib/postgresql

volumes:
  dexian_postgres_data:
