name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: dexian
          POSTGRES_USER: dexian
          POSTGRES_PASSWORD: dexian_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dexian -d dexian"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://dexian:dexian_ci@127.0.0.1:5432/dexian
      BOOKING_TOKEN_SECRET: ci-only-booking-token-secret-32-chars
      SMS_CODE_SECRET: ci-only-sms-code-secret-at-least-32-chars
      ADMIN_WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
